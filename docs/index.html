<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <!-- viewer.js fills this in from scene.json -->
  <model-viewer id="viewer" camera-controls touch-action="pan-y" interpolation-decay="120"
                animation-crossfade-duration="400" interaction-prompt="none">
  </model-viewer>

  <aside id="info" class="mv-info" hidden>
    <button id="back" class="mv-back" type="button">← Back</button>
    <h2 id="info-title"></h2>
    <p id="info-text"></p>
  </aside>

  <button id="bg-toggle" class="mv-bg-toggle" type="button" hidden>Background</button>

  <section id="player" class="mv-player" aria-label="Animations" hidden>
    <div class="mv-player-controls">
      <button id="play" class="mv-play" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="mv-icon-play" d="M8 5v14l11-7z"/><path class="mv-icon-pause" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <input id="scrub" class="mv-scrub" type="range" min="0" max="1" step="0.001" value="0"
             aria-label="Animation position" disabled>
      <button id="loop" class="mv-loop" type="button" aria-pressed="false">Loop</button>
    </div>
    <div id="clips" class="mv-clips"></div>
  </section>

  <nav id="variants" class="mv-variants" aria-label="Material variants" hidden></nav>
</body>
</html>
